<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LineDistro Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── HEADER ── -->
<header class="app-header">
    <div class="header-inner">
        <div class="logo">
            <span class="logo-icon">◈</span>
            <span class="logo-text">LineDistro <em>Pro</em></span>
        </div>
        <button class="btn-ghost" onclick="openHistory()">📋 Riwayat</button>
    </div>
</header>

<!-- ── SETUP PANEL ── -->
<main class="app-main">
    <section class="panel setup-panel">
        <p class="panel-label">SUMBER MEDIA</p>
        <div class="input-row">
            <input type="text" id="songTitle" placeholder="Judul lagu...">
            <input type="text" id="ytLink" placeholder="Link YouTube...">
            <button class="btn-primary" onclick="loadVideo()">▶ Muat</button>
            <label class="btn-ghost file-btn">
                ↑ Import MP4 / Audio
                <input type="file" id="mediaUpload" accept="video/mp4,audio/*" onchange="loadLocalMedia(this)">
            </label>
        </div>

        <p class="panel-label" style="margin-top:18px;">PRESET</p>
        <div class="input-row">
            <select id="presetSelect" onchange="loadSelectedPreset()">
                <option value="">— Pilih preset —</option>
            </select>
            <button class="btn-ghost" onclick="saveNewPreset()">💾 Simpan</button>
            <button class="btn-danger-soft" onclick="deleteSelectedPreset()">🗑 Hapus</button>
            <button class="btn-ghost" onclick="openEditMenu()">✏️ Edit Member</button>
        </div>

        <p class="panel-label" style="margin-top:18px;">TAMBAH MEMBER</p>
        <div class="input-row">
            <input type="text" id="memberName" placeholder="Nama member...">
            <input type="color" id="memberColor" value="#a78bfa" title="Pilih warna">
            <label class="btn-ghost file-btn">
                🖼 Foto
                <input type="file" id="memberPhoto" accept="image/*">
            </label>
            <button class="btn-primary" onclick="addNewMember()">+ Tambah</button>
        </div>
    </section>

    <!-- ── MAIN STAGE ── -->
    <div class="stage">
        <!-- Player -->
        <section class="panel player-panel">
            <p class="panel-label">PLAYER</p>
            <div id="player" class="yt-player"></div>
            <video id="localMedia" controls style="display:none; width:100%; border-radius:10px;"></video>
            <audio id="audioPlayer" controls style="display:none; width:100%; margin-top:8px;"></audio>
            <p id="mediaLabel" class="media-label"></p>
        </section>

        <!-- Members -->
        <section class="panel members-panel">
            <p class="panel-label">MEMBER</p>
            <div class="member-list" id="memberList"></div>
            <div id="emptyHint" class="empty-hint">
                <span>✦</span>
                <p>Belum ada member.<br>Tambahkan di atas.</p>
            </div>
        </section>
    </div>

    <!-- ── BOTTOM BAR ── -->
    <div class="bottom-bar">
        <button class="btn-finish" onclick="finish()">✦ Selesai &amp; Hitung</button>
        <button class="btn-ghost" onclick="confirmResetAll()">↺ Reset Semua</button>
    </div>
</main>

<!-- ════════════════════════════════
     MODALS
     ════════════════════════════════ -->

<!-- Konfirmasi generik -->
<div id="confirmModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <p class="modal-icon" id="confirmIcon">⚠️</p>
        <h3 id="confirmTitle">Konfirmasi</h3>
        <p id="confirmMsg" class="modal-sub"></p>
        <div class="modal-actions">
            <button class="btn-ghost" onclick="closeConfirm()">Batal</button>
            <button class="btn-danger" id="confirmOkBtn">Hapus</button>
        </div>
    </div>
</div>

<!-- Toast / alert kecil -->
<div id="toast" class="toast" style="display:none;"></div>

<!-- Input nama preset -->
<div id="promptModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <p class="modal-icon">💾</p>
        <h3 id="promptTitle">Simpan Preset</h3>
        <p class="modal-sub" id="promptSub">Beri nama untuk preset ini.</p>
        <input type="text" id="promptInput" class="modal-input" placeholder="Nama preset...">
        <div class="modal-actions">
            <button class="btn-ghost" onclick="closePrompt()">Batal</button>
            <button class="btn-primary" onclick="confirmPrompt()">Simpan</button>
        </div>
    </div>
</div>

<!-- Edit Member -->
<div id="editModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <p class="modal-icon">✏️</p>
        <h3>Edit Member</h3>
        <p class="modal-sub">Pilih member lalu ubah detail-nya.</p>
        <select id="editMemberSelect" class="modal-input" onchange="populateEditForm()">
            <option value="">— Pilih member —</option>
        </select>
        <input type="text" id="editMemberName" class="modal-input" placeholder="Nama baru...">
        <div class="edit-color-row">
            <label class="modal-sub">Warna</label>
            <input type="color" id="editMemberColor" value="#a78bfa">
        </div>
        <label class="btn-ghost file-btn" style="width:100%; justify-content:center;">
            🖼 Ganti Foto
            <input type="file" id="editMemberPhoto" accept="image/*">
        </label>
        <div class="modal-actions">
            <button class="btn-ghost" onclick="closeEditModal()">Batal</button>
            <button class="btn-primary" onclick="applyEdit()">Simpan Perubahan</button>
        </div>
    </div>
</div>

<!-- Hasil -->
<div id="resultModal" class="modal-overlay" style="display:none;">
    <div class="modal-box modal-wide">
        <p class="modal-icon">✦</p>
        <h3 id="resultSongTitle">Hasil</h3>
        <p class="modal-sub" id="resultDateLabel"></p>
        <div id="leaderboard" class="leaderboard"></div>
        <canvas id="resultChart" style="margin-top:20px; max-height:260px;"></canvas>
        <button class="btn-primary" style="width:100%; margin-top:18px;" onclick="closeResultModal()">Tutup</button>
    </div>
</div>

<!-- Riwayat -->
<div id="historyModal" class="modal-overlay" style="display:none;">
    <div class="modal-box modal-wide">
        <div class="modal-topbar">
            <h3>📋 Riwayat</h3>
            <button class="btn-danger-soft" onclick="confirmClearHistory()">🗑 Hapus Semua</button>
        </div>
        <div id="historyList"></div>
        <button class="btn-ghost" style="width:100%; margin-top:14px;" onclick="closeHistoryModal()">Tutup</button>
    </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>
</body>
</html>
